<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hallo Welt</title>
</head>
<body>
	<h1>Hallo Welt</h1>
	<p>Dieser Text steht direkt im Body-Element.</p>

	<h2>1. Alert-Box mit Inline-JavaScript</h2>
	<button onclick="alert('Hallo Welt! (Inline JavaScript)')">
		Inline-Alert anzeigen
	</button>

	<h2>2. Alert-Box mit externem JavaScript</h2>
	<button id="external-alert-button">Externen Alert anzeigen</button>

	<h2>3. Inline-Text im Body-Element</h2>
	<p>Hallo Welt! Dieser Text steht direkt im Body-Element.</p>

	<h2>4. Hallo Welt nach einem Button-Klick</h2>
	<button id="hello-button">Hallo sagen</button>
	<p id="hello-message"></p>

	<script src="script.js"></script>
</body>
</html>
